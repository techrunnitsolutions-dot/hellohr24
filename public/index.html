<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HelloHR - HR Management Portal</title>
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HelloHR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="hidden">
  <form id="loginForm" class="login-card">
    <div class="brand big">Hello<span>HR</span></div>
    <h2 id="loginTitle" style="margin:0 0 4px"></h2><p class="muted" id="loginSub"></p>
    <label><span id="idLabel">Email</span><input name="identifier" required autofocus autocapitalize="none" autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <div id="loginErr" class="err"></div>
    <button class="btn primary block">Sign in</button>
    <div class="demo muted" id="demoBox"></div>
    <div id="appDownload" class="appdl"><div class="appdl-t">Get the HelloHR app</div><div class="appdl-b"><button type="button" class="storebtn" data-app="ios" aria-label="Download for iPhone and iPad"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.46 2.22-1.2 3-.8.85-2.1 1.5-3.16 1.42-.13-1.1.4-2.27 1.14-3.03.82-.86 2.2-1.5 3.22-1.39zM20.5 17.3c-.55 1.27-.82 1.84-1.53 2.96-1 1.57-2.4 3.52-4.14 3.54-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.74-.02-3.07-1.78-4.07-3.35C-.15 16.1-.45 11.5 1.3 8.8c1.24-1.9 3.2-3.02 5.04-3.02 1.87 0 3.05 1.02 4.6 1.02 1.5 0 2.41-1.02 4.58-1.02 1.64 0 3.38.9 4.62 2.44-4.06 2.23-3.4 8.04.36 9.08z"/></svg><span><small>Download for</small><b>iOS</b></span></button><button type="button" class="storebtn" data-app="android" aria-label="Download for Android"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85a.637.637 0 00-.83.22l-1.88 3.24a11.463 11.463 0 00-8.94 0L5.65 5.67a.643.643 0 00-.87-.2c-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 001 18h22a10.78 10.78 0 00-5.4-8.52zM7 15.25a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5zm10 0a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z"/></svg><span><small>Download for</small><b>Android</b></span></button></div></div>
  </form>
</div>
<div id="app" class="hidden">
  <aside id="sidebar"><div class="brand">Hello<span>HR</span></div><nav id="nav"></nav></aside>
  <div class="content">
    <header>
      <button id="menuBtn" class="btn ghost">☰</button>
      <div id="banner"></div><div class="grow"></div>
      <div id="userbox"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="backdrop"></div>
<div id="modalRoot"></div>
<div id="toast"></div>
<script src="/app.js"></script>
<script src="/install.js"></script>
</body>
</html>
